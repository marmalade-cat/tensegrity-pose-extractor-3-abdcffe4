<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tensegrity Pose Normalizer — Prototype</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:18px;color:#222}
    textarea{width:100%;height:120px;font-family:monospace}
    label{display:block;margin-top:8px}
    .row{display:flex;gap:8px}
    select,input[type=text]{flex:1}
    pre{background:#f6f6f6;padding:8px;overflow:auto}
    button{margin-top:8px}
  </style>
</head>
<body>
  <h2>Tensegrity Pose Normalizer — Prototype</h2>
  <p>Paste CSV or JSON (array of objects). This tool will help map source fields into a stable schema and export normalized JSON/CSV. No network access.</p>

  <label>Input (paste CSV or JSON array):</label>
  <textarea id="input"></textarea>
  <div class="row">
    <button id="parse">Parse</button>
    <button id="clear">Clear</button>
  </div>

  <div id="mappingArea" style="display:none">
    <h3>Field mapping</h3>
    <p>Map source fields (or type new keys). Unmapped fields will go into metadata.</p>
    <div id="mappings"></div>
    <button id="normalize">Normalize</button>
  </div>

  <h3>Output</h3>
  <div id="outButtons" style="display:none">
    <button id="downloadJson">Download JSON</button>
    <button id="downloadCsv">Download CSV</button>
  </div>
  <pre id="output"></pre>

<script>
function parseCSV(text){
  // simple CSV parser (no fancy quoting)
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<1) return [];
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(l=>{
    const cols = l.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h]= (cols[i]===undefined?"":cols[i].trim()));
    return obj;
  });
}

function tryParseJSONorCSV(text){
  try{ const v = JSON.parse(text); if(Array.isArray(v)) return v; }
  catch(e){}
  // fallback to CSV
  return parseCSV(text);
}

const stableSchema = ['id','module_type','position_x','position_y','position_z','orientation','metadata'];

let records = [];

document.getElementById('parse').onclick = ()=>{
  const txt = document.getElementById('input').value.trim();
  if(!txt){ alert('Paste some JSON or CSV first.'); return; }
  try{
    records = tryParseJSONorCSV(txt);
  }catch(e){ alert('Could not parse input'); return; }
  if(!Array.isArray(records) || records.length==0){ alert('No records found.'); return; }
  // build mappings UI
  const keys = Object.keys(records[0]);
  const mdiv = document.getElementById('mappings'); mdiv.innerHTML='';
  stableSchema.forEach(s=>{
    if(s==='metadata') return; // metadata is auto
    const row = document.createElement('div'); row.className='row';
    const sel = document.createElement('select');
    const emptyOpt = document.createElement('option'); emptyOpt.value=''; emptyOpt.text='(none)'; sel.appendChild(emptyOpt);
    keys.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.text=k; sel.appendChild(o); });
    const txt = document.createElement('input'); txt.type='text'; txt.placeholder='fallback value';
    const lab = document.createElement('label'); lab.textContent = s; lab.style.width='120px'; lab.style.fontWeight='bold';
    row.appendChild(lab); row.appendChild(sel); row.appendChild(txt);
    mdiv.appendChild(row);
  });
  document.getElementById('mappingArea').style.display='block';
  document.getElementById('outButtons').style.display='none';
}

document.getElementById('clear').onclick = ()=>{ document.getElementById('input').value=''; records=[]; document.getElementById('mappingArea').style.display='none'; document.getElementById('output').textContent=''; }

function normalizeRecords(mappings){
  return records.map((r,idx)=>{
    const out = {};
    // id fallback
    out.id = (mappings.id && r[mappings.id]) || mappings._fallbacks.id || (r.id||r._id||('rec_'+idx));
    out.module_type = (mappings.module_type && r[mappings.module_type]) || mappings._fallbacks.module_type || '';
    ['position_x','position_y','position_z'].forEach(k=>{
      out[k] = (mappings[k] && r[mappings[k]]) || mappings._fallbacks[k] || null;
      // try numeric
      const n = Number(out[k]); out[k] = isNaN(n)? out[k] : n;
    });
    out.orientation = (mappings.orientation && r[mappings.orientation]) || mappings._fallbacks.orientation || '';
    // metadata: any source fields not mapped
    const mappedSrc = new Set(Object.values(mappings).filter(v=>typeof v==='string' && v.length>0));
    const meta = {};
    Object.keys(r).forEach(k=>{ if(!mappedSrc.has(k)) meta[k]=r[k]; });
    out.metadata = meta;
    return out;
  });
}

function toCSV(arr){
  if(!arr.length) return '';
  const headers = Object.keys(arr[0]);
  const rows = [headers.join(',')];
  arr.forEach(o=>{
    const vals = headers.map(h=>{
      const v = o[h];
      if(typeof v==='object') return '"'+JSON.stringify(v).replace(/"/g,'""')+'"';
      return '"'+String(v).replace(/"/g,'""')+'"';
    });
    rows.push(vals.join(','));
  });
  return rows.join('\n');
}

document.getElementById('normalize').onclick = ()=>{
  const selects = document.querySelectorAll('#mappings select');
  const inputs = document.querySelectorAll('#mappings input');
  const mappings = {_fallbacks:{}};
  const keys = ['id','module_type','position_x','position_y','position_z','orientation'];
  selects.forEach((s,i)=>{ const k=keys[i]; mappings[k]= s.value; });
  inputs.forEach((inp,i)=>{ const k=keys[i]; if(inp.value) mappings._fallbacks[k]=inp.value; });
  const norm = normalizeRecords(mappings);
  const out = JSON.stringify(norm, null, 2);
  document.getElementById('output').textContent = out;
  document.getElementById('outButtons').style.display='block';
  // attach download
  document.getElementById('downloadJson').onclick = ()=>{
    const blob = new Blob([out],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='normalized.json'; a.click();
  };
  document.getElementById('downloadCsv').onclick = ()=>{
    const csv = toCSV(norm);
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='normalized.csv'; a.click();
  };
}
</script>
</body>
</html>
